<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1424">
<title>送给睿睿子的扫雷</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:#1a1424;color:#f0e6f5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:780px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));gap:8px}
/* 难度栏横向可滑：按钮不压缩，超出就滑，隐藏滚动条 */
.diffs{display:flex;gap:6px;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  scroll-snap-type:x proximity;padding-bottom:2px}
.diffs::-webkit-scrollbar{display:none}
.diffs button{flex:0 0 auto;padding:9px 15px;font-size:13px;border-radius:9px;
  border:1px solid #4a3a5c;white-space:nowrap;scroll-snap-align:center;
  background:#271d36;color:#cbb8d8;font-family:inherit}
.diffs button.on{background:#ff8fbf;color:#2b2233;border-color:#ff8fbf;font-weight:700}
/* 立绘底色与图片背景 #211531 一致，人物无缝融进面板 */
.hud{display:flex;gap:10px;background:#211531;border-radius:12px;
  padding:8px 10px 0 8px;align-items:flex-end;flex:0 0 auto;overflow:hidden}
#char{width:96px;height:102px;flex:0 0 auto;position:relative;
  animation:bob 3.4s ease-in-out infinite}
#char img{position:absolute;left:0;bottom:0;width:100%;height:102px;
  opacity:0;transition:opacity .18s ease;pointer-events:none}
#char img.on{opacity:1}
#char.snap img{transition:none}
#char.pop{animation:pop .5s ease-out}
#char.shake{animation:shake .38s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(1)}28%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}
  40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.right{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-bottom:9px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:#9c88ad}
.stat b{color:#fff;font-size:14px;font-weight:600}
#say{font-size:12.5px;line-height:1.35;color:#ffd6e6;min-height:2.7em;white-space:pre-line}
.boardwrap{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;background:#1e1729;border-radius:12px;padding:6px}
#board{margin:auto;display:grid;gap:1px;touch-action:pan-x pan-y;flex:0 0 auto}
.cell{width:var(--cs);height:var(--cs);border-radius:2px;background:#5c4a72;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cs) * .64);font-weight:800;line-height:1;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.cell.op{background:#2e2440}
.cell.fl{background:#5c4a72}
.cell.mine{background:#7a2a3c}
.cell.boom{background:#e8455f}
.cell.bad{background:#4a3550}
.n1{color:#7fb2ff}.n2{color:#6ee07f}.n3{color:#ff7d8a}.n4{color:#c39bff}
.n5{color:#ffb066}.n6{color:#5fe0d0}.n7{color:#e8e0f0}.n8{color:#9c88ad}
.sizerow{display:flex;align-items:center;gap:8px;font-size:11px;color:#9c88ad;flex:0 0 auto}
#zoom{flex:1;accent-color:#ff8fbf}
.ctrl{display:flex;gap:8px;flex:0 0 auto}
.big{flex:1;padding:14px 0;font-size:15px;font-weight:700;border-radius:12px;
  border:1px solid #4a3a5c;background:#2e2440;color:#e6d8f0;font-family:inherit}
.big.on{background:#ffcf5c;color:#2b2233;border-color:#ffcf5c}
#gen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#1a1424cc;font-size:14px;color:#ffd6e6;z-index:9}
#gen.hidden{display:none}
/* 暂停：盘面糊掉，防止靠暂停免费思考 */
#board.blur{filter:blur(7px);opacity:.55;pointer-events:none}
#pauseTag{color:#ffcf5c}
#pauseTag.hidden{display:none}
/* 确认弹窗 */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:#120e1ad9;padding:22px}
#modal.hidden{display:none}
.card{width:100%;max-width:300px;background:#2a1f3a;border:1px solid #4a3a5c;
  border-radius:16px;padding:18px 16px 14px;text-align:center;
  box-shadow:0 12px 40px #0008}
.card h3{margin:0 0 6px;font-size:16px;color:#fff}
.card p{margin:0 0 15px;font-size:12.5px;line-height:1.5;color:#b9a6c8}
.card p b{color:#ffcf5c;font-weight:600}
.card .row{display:flex;flex-direction:column;gap:8px}
.card button{padding:13px 0;font-size:14.5px;font-weight:700;border-radius:11px;
  border:1px solid #4a3a5c;background:#3a2c4e;color:#e6d8f0;font-family:inherit}
.card button.warn{background:#ff8fbf;color:#2b2233;border-color:#ff8fbf}
@media (max-height:600px){
  #char{width:72px;height:77px}#char img{height:77px}
  #say{min-height:1.4em}
}
</style>
</head>
<body>
<div id="app">
  <div class="diffs">
    <button data-d="easy">初级 9×9</button>
    <button data-d="mid">中级 16×16</button>
    <button data-d="hard">高级 30×16</button>
    <button data-d="master">大师 30×30</button>
  </div>
  <div class="hud">
    <div id="char"></div>
    <div class="right">
      <div class="stats">
        <div class="stat"><span>剩余雷</span><b id="mines">–</b></div>
        <div class="stat"><span>时间 <span id="pauseTag" class="hidden">⏸</span></span><b id="time">0.000</b></div>
        <div class="stat"><span>3BV/s</span><b id="bvs">–</b></div>
        <div class="stat"><span>最佳</span><b id="best">–</b></div>
      </div>
      <div id="say">随时可以开始～</div>
    </div>
  </div>
  <div class="boardwrap"><div id="board"></div></div>
  <div class="sizerow"><span>格子大小</span><input id="zoom" type="range" min="12" max="46" step="1" value="33"><span id="zval">33</span></div>
  <div class="ctrl">
    <button id="mode" class="big">⛏ 挖开</button>
    <button id="again" class="big">↻ 重开</button>
  </div>
</div>
<div id="gen" class="hidden">正在生成无猜盘…</div>
<div id="modal" class="hidden">
  <div class="card">
    <h3 id="mTitle">这盘还没结束</h3>
    <p id="mBody">计时已暂停。</p>
    <div class="row">
      <button id="mNo">继续这盘</button>
      <button id="mYes" class="warn">放弃</button>
    </div>
  </div>
</div>

const DIFF = {
  easy:   {w: 9,  h: 9,  m: 10,  label: '初级'},
  mid:    {w: 16, h: 16, m: 40,  label: '中级'},
  hard:   {w: 30, h: 16, m: 99,  label: '高级'},
  /* 密度 22.2%，比高级(20.6%)更狠；再往上无猜盘就生成不出来了 */

};
let curDiff = localStorage.getItem('msg.diff') || 'mid';
if (!DIFF[curDiff]) curDiff = 'mid';
let G = null;
const els = [];

function nbrs(w, h, i) {
  const x = i % w, y = (i - x) / w, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
    out.push(ny * w + nx);
  }
  return out;
}
function buildNbrTable(w, h) {
  const t = new Array(w * h);
  for (let i = 0; i < w * h; i++) t[i] = nbrs(w, h, i);
  return t;
}
function placeMines(w, h, m, safe, NB) {
  const n = w * h, mine = new Uint8Array(n);
  const banned = new Set([safe].concat(NB[safe]));
  const pool = [];
  for (let i = 0; i < n; i++) if (!banned.has(i)) pool.push(i);
  for (let k = 0; k < m; k++) {
    const j = k + Math.floor(Math.random() * (pool.length - k));
    const t = pool[k]; pool[k] = pool[j]; pool[j] = t;
    mine[pool[k]] = 1;
  }
  return mine;
}
function calcVals(n, mine, NB) {
  const val = new Int8Array(n);
  for (let i = 0; i < n; i++) {
    if (mine[i]) { val[i] = -1; continue; }
    let c = 0;
    for (const j of NB[i]) if (mine[j]) c++;
    val[i] = c;
  }
  return val;
}
function calc3BV(n, val, NB) {
  const seen = new Uint8Array(n);
  let bv = 0;
  for (let i = 0; i < n; i++) {
    if (val[i] !== 0 || seen[i]) continue;
    bv++;
    const st = [i]; seen[i] = 1;
    while (st.length) {
      const c = st.pop();
      for (const j of NB[c]) {
        if (seen[j]) continue;
        seen[j] = 1;
        if (val[j] === 0) st.push(j);
      }
    }
  }
  for (let i = 0; i < n; i++) if (val[i] > 0 && !seen[i]) bv++;
  return bv;
}
/* ---------- 无猜求解器（纯逻辑，不猜） ---------- */
function openLogical(k, i, val, NB) {
  if (k[i] !== 0) return false;
  const st = [i];
  while (st.length) {
    const c = st.pop();
    if (k[c] !== 0) continue;
    k[c] = 1;
    if (val[c] === 0) for (const j of NB[c]) if (k[j] === 0) st.push(j);
  }
  return false;
}
function solve(n, m, val, NB, start) {
  const k = new Uint8Array(n);
  openLogical(k, start, val, NB);
  let flags = 0;
  const safeLeft = n - m;
  const cnt = () => { let c = 0; for (let i = 0; i < n; i++) if (k[i] === 1) c++; return c; };
  for (;;) {
    if (cnt() === safeLeft) return {ok: true, k};
    let prog = false;
    const cons = [];
    for (let i = 0; i < n; i++) {
      if (k[i] !== 1 || val[i] <= 0) continue;
      const unk = [];
      let f = 0;
      for (const j of NB[i]) { if (k[j] === 0) unk.push(j); else if (k[j] === 2) f++; }
      if (!unk.length) continue;
      const need = val[i] - f;
      if (need === 0) { for (const j of unk) openLogical(k, j, val, NB); prog = true; }
      else if (need === unk.length) { for (const j of unk) { k[j] = 2; flags++; } prog = true; }
      else cons.push({unk, need, set: new Set(unk)});
    }
    if (prog) continue;
    /* 子集差：覆盖 1-2-1、1-2-2-1 等定式 */
    for (let a = 0; a < cons.length && !prog; a++) {
      for (let b = 0; b < cons.length; b++) {
        if (a === b) continue;
        const A = cons[a], B = cons[b];
        if (A.unk.length >= B.unk.length) continue;
        let sub = true;
        for (const c of A.unk) if (!B.set.has(c)) { sub = false; break; }
        if (!sub) continue;
        const diff = B.unk.filter(c => !A.set.has(c));
        const need = B.need - A.need;
        if (need === 0) { for (const c of diff) openLogical(k, c, val, NB); prog = true; break; }
        if (need === diff.length) { for (const c of diff) { k[c] = 2; flags++; } prog = true; break; }
      }
    }
    if (prog) continue;
    /* 全局剩余雷数 */
    const unk = [];
    for (let i = 0; i < n; i++) if (k[i] === 0) unk.push(i);
    const left = m - flags;
    if (left === 0 && unk.length) { for (const c of unk) openLogical(k, c, val, NB); continue; }
    if (left === unk.length && unk.length) { for (const c of unk) { k[c] = 2; flags++; } continue; }
    return {ok: false, k};
  }
}
/* 卡住时把边界上的雷挪到深处再解一次 —— 高级盘全靠它才生成得出来 */
function repair(n, m, mine, k, NB) {
  const front = [], deep = [];
  for (let i = 0; i < n; i++) {
    if (k[i] !== 0) continue;
    let touch = false;
    for (const j of NB[i]) if (k[j] === 1) { touch = true; break; }
    (touch ? front : deep).push(i);
  }
  const fm = front.filter(i => mine[i]), dn = deep.filter(i => !mine[i]);
  if (!fm.length || !dn.length) return false;
  const a = fm[Math.floor(Math.random() * fm.length)];
  const b = dn[Math.floor(Math.random() * dn.length)];
  mine[a] = 0; mine[b] = 1;
  return true;
}
async function genNoGuess(w, h, m, safe, NB) {
  const n = w * h, t0 = performance.now();
  const budget = n > 500 ? 15000 : 6000;   // 大师级 900 格，手机慢，放宽兜底门槛
  let attempts = 0;
  for (;;) {
    const mine = placeMines(w, h, m, safe, NB);
    let val = calcVals(n, mine, NB);
    for (let r = 0; r < 14; r++) {
      const res = solve(n, m, val, NB, safe);
      if (res.ok) return {mine, val, noGuess: true};
      if (!repair(n, m, mine, res.k, NB)) break;
      val = calcVals(n, mine, NB);
    }
    attempts++;
    if (performance.now() - t0 > budget) {
      const mn = placeMines(w, h, m, safe, NB);
      return {mine: mn, val: calcVals(n, mn, NB), noGuess: false};
    }
    if (attempts % 20 === 0) await new Promise(r => setTimeout(r, 0));
  }
}
/* ---------- 局状态 ---------- */
const $ = id => document.getElementById(id);
const board = $('board');
let cellSize = +(localStorage.getItem('msg.cs') || 0) || 0;
let flagMode = false;

function bestKey(d) { return 'msg.best.' + d; }
function fmt(t) { return t.toFixed(3); }
function showBest() {
  const raw = localStorage.getItem(bestKey(curDiff));
  if (!raw) { $('best').textContent = '–'; return; }
  try { $('best').textContent = fmt(JSON.parse(raw).t) + 's'; }
  catch (e) { $('best').textContent = '–'; }
}
const DEFAULT_CS = 33;
function autoCellSize() {
  return cellSize || DEFAULT_CS;      // 一律 30，大盘面靠滑动看
}
/* ---------- 暂停 ----------
   多个原因可同时挂起（后台 + 弹窗），全部解除才恢复计时。
   计时 = 墙上时间 − 累计暂停时长；走神判定同样扣除，
   否则挂后台回来会立刻弹发呆脸。                          */
const pauses = new Set();
function paused() { return pauses.size > 0; }
function elapsed() {
  if (!G || !G.started) return 0;
  const end = G.over ? G.tEnd : (G.pauseAt || performance.now());
  return (end - G.t0 - G.pausedMs) / 1000;
}
function pauseOn(reason) {
  if (!G || !G.started || G.over) return;
  const first = !paused();
  pauses.add(reason);
  if (!first) return;
  G.pauseAt = performance.now();
  $('pauseTag').classList.remove('hidden');
  board.classList.add('blur');
  $('time').textContent = fmt(elapsed());
}
function pauseOff(reason) {
  if (!pauses.delete(reason) || paused()) return;
  $('pauseTag').classList.add('hidden');
  board.classList.remove('blur');
  if (!G || !G.started || G.over || !G.pauseAt) { G.pauseAt = 0; return; }
  const dur = performance.now() - G.pauseAt;
  G.pausedMs += dur;
  G.lastAct += dur;                 // 暂停不算走神
  G.pauseAt = 0;
  startTick();
}
function newGame() {
  pauses.clear();
  $('pauseTag').classList.add('hidden');
  board.classList.remove('blur');
  const d = DIFF[curDiff], n = d.w * d.h;
  G = {w: d.w, h: d.h, m: d.m, n, NB: buildNbrTable(d.w, d.h),
       mine: null, val: null, st: new Uint8Array(n),
       started: false, over: false, win: false, flags: 0, opened: 0,
       t0: 0, tEnd: 0, bv: 0, noGuess: true,
       pauseAt: 0, pausedMs: 0, ticking: false,
       acts: [], lastAct: 0, fastAt: 0, stallStage: 0};
  const cs = autoCellSize();
  $('zoom').value = cs; $('zval').textContent = cs;
  board.style.setProperty('--cs', cs + 'px');
  board.style.gridTemplateColumns = `repeat(${d.w}, ${cs}px)`;
  board.textContent = ''; els.length = 0;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const e = document.createElement('div');
    e.className = 'cell'; e.dataset.i = i;
    frag.appendChild(e); els.push(e);
  }
  board.appendChild(frag);
  $('mines').textContent = d.m;
  $('time').textContent = '0.000';
  $('bvs').textContent = '–';
  showBest();
  setExpr('wave'); say('ready');
}
function paint(i) {
  const e = els[i], s = G.st[i];
  if (s === 2) { e.className = 'cell fl'; e.textContent = '🚩'; return; }
  if (s === 0) { e.className = 'cell'; e.textContent = ''; return; }
  const v = G.val[i];
  e.className = 'cell op' + (v > 0 ? ' n' + v : '');
  e.textContent = v > 0 ? v : '';
}
function reveal(i) {
  const st = G.st, val = G.val, stack = [i];
  while (stack.length) {
    const c = stack.pop();
    if (st[c] !== 0) continue;
    st[c] = 1; G.opened++;
    paint(c);
    if (val[c] === 0) for (const j of G.NB[c]) if (st[j] === 0) stack.push(j);
  }
}
function endGame(win, boomIdx) {
  G.over = true; G.win = win; G.tEnd = performance.now();
  pauses.clear();
  $('pauseTag').classList.add('hidden');
  board.classList.remove('blur');
  const secs = elapsed();
  $('time').textContent = fmt(secs);
  for (let i = 0; i < G.n; i++) {
    if (G.mine[i] && G.st[i] !== 2) { els[i].className = 'cell mine'; els[i].textContent = '💣'; }
    else if (!G.mine[i] && G.st[i] === 2) { els[i].className = 'cell bad'; els[i].textContent = '✕'; }
  }
  if (boomIdx != null) { els[boomIdx].className = 'cell boom'; els[boomIdx].textContent = '💥'; }
  if (!win) {
    setExpr('boom'); anim('shake');
    say('boom', `撑到 ${fmt(secs)}s`);
    if (navigator.vibrate) navigator.vibrate(60);
    return;
  }
  const bvs = G.bv / secs;
  $('bvs').textContent = bvs.toFixed(2);
  $('mines').textContent = 0;
  const raw = localStorage.getItem(bestKey(curDiff));
  let prev = null;
  try { prev = raw ? JSON.parse(raw) : null; } catch (e) { prev = null; }
  const isRec = G.noGuess && (!prev || secs < prev.t);
  if (isRec) {
    localStorage.setItem(bestKey(curDiff), JSON.stringify({t: secs, bvs, d: Date.now()}));
    showBest();
    setExpr('record'); anim('pop');
    say('record', `${fmt(secs)}s · 3BV ${G.bv} · ${bvs.toFixed(2)} 3BV/s` +
      (prev ? `（上次 ${fmt(prev.t)}s）` : ''));
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  } else {
    setExpr('win'); anim('pop');
    say('win', `${fmt(secs)}s · 3BV ${G.bv} · ${bvs.toFixed(2)} 3BV/s`);
  }
}
function checkWin() {
  if (G.opened === G.n - G.m) { endGame(true, null); return true; }
  return false;
}
function act(kind) {
  const now = performance.now();
  G.lastAct = now;
  G.stallStage = 0;
  if (expr === 'stall' || expr === 'think') setExpr('idle');
  if (kind === 'open') {
    G.acts.push(now);
    while (G.acts.length && now - G.acts[0] > 1400) G.acts.shift();
    if (G.acts.length >= 7 && now - G.fastAt > 5000 && !G.over) {
      G.fastAt = now; setExpr('fast'); say('fast');
    }
  }
}
let genBusy = false;
async function firstOpen(i) {
  if (genBusy) return;
  genBusy = true;
  const timer = setTimeout(() => $('gen').classList.remove('hidden'), 140);
  const r = await genNoGuess(G.w, G.h, G.m, i, G.NB);
  clearTimeout(timer); $('gen').classList.add('hidden');
  genBusy = false;
  G.mine = r.mine; G.val = r.val; G.noGuess = r.noGuess;
  G.bv = calc3BV(G.n, G.val, G.NB);
  G.started = true; G.t0 = performance.now(); G.lastAct = G.t0;
  reveal(i);
  setExpr('idle');
  say('start', r.noGuess ? `3BV ${G.bv}` : `3BV ${G.bv} · 这盘没生成出无猜，谨慎`);
  act('open');
  startTick();
  checkWin();
}
function doOpen(i) {
  if (G.over) return;
  if (!G.started) { firstOpen(i); return; }
  if (G.st[i] !== 0) return;
  if (G.mine[i]) { act('open'); endGame(false, i); return; }
  reveal(i); act('open'); checkWin();
}
function doFlag(i) {
  if (G.over || G.st[i] === 1) return;
  if (!G.started) return;
  G.st[i] = G.st[i] === 2 ? 0 : 2;
  G.flags += G.st[i] === 2 ? 1 : -1;
  paint(i);
  $('mines').textContent = G.m - G.flags;
  act('flag');
  if (navigator.vibrate) navigator.vibrate(12);
}
function doChord(i) {
  if (G.over || !G.started || G.st[i] !== 1 || G.val[i] <= 0) return;
  let f = 0;
  const open = [];
  for (const j of G.NB[i]) { if (G.st[j] === 2) f++; else if (G.st[j] === 0) open.push(j); }
  if (f !== G.val[i] || !open.length) return;
  const bad = open.find(j => G.mine[j]);
  if (bad != null) { act('open'); endGame(false, bad); return; }
  for (const j of open) reveal(j);
  act('open'); checkWin();
}
/* ---------- 计时 & 走神检测（两段） ---------- */
function tick() {
  if (!G || !G.started || G.over || paused()) { if (G) G.ticking = false; return; }
  G.ticking = true;
  const now = performance.now();
  $('time').textContent = fmt(elapsed());
  const idle = now - G.lastAct;
  if (idle > 9000 && G.stallStage < 2) { G.stallStage = 2; setExpr('think'); say('think'); }
  else if (idle > 3600 && G.stallStage < 1) { G.stallStage = 1; setExpr('stall'); say('stall'); }
  requestAnimationFrame(tick);
}
/* 只从这里启动，防止恢复时并行跑出两条 rAF 链 */
function startTick() { if (!G || G.ticking) return; tick(); }
/* ---------- 输入：点=主操作，长按=副操作，点数字=chord ---------- */
let press = null;
board.addEventListener('contextmenu', e => e.preventDefault());
board.addEventListener('pointerdown', e => {
  const t = e.target.closest('.cell');
  if (!t) return;
  const i = +t.dataset.i;
  if (e.pointerType === 'mouse' && e.button === 2) { doFlag(i); press = null; return; }
  if (e.pointerType === 'mouse' && e.button === 1) { doChord(i); press = null; return; }
  press = {i, x: e.clientX, y: e.clientY, done: false,
    lp: setTimeout(() => {
      if (!press || press.done) return;
      press.done = true;
      if (G.st[i] === 1) doChord(i);
      else if (flagMode) doOpen(i);
      else doFlag(i);
    }, 300)};
});
board.addEventListener('pointermove', e => {
  if (!press) return;
  if (Math.abs(e.clientX - press.x) > 10 || Math.abs(e.clientY - press.y) > 10) {
    clearTimeout(press.lp); press = null;
  }
});
function endPress(e) {
  if (!press) return;
  clearTimeout(press.lp);
  const p = press; press = null;
  if (p.done || e.type !== 'pointerup') return;
  const i = p.i;
  if (G.st[i] === 1) doChord(i);
  else if (flagMode) doFlag(i);
  else doOpen(i);
}
board.addEventListener('pointerup', endPress);
board.addEventListener('pointercancel', endPress);
board.addEventListener('pointerleave', endPress);
/* ---------- 控件 ---------- */
/* ---------- 放弃当前局的确认（局中才拦） ---------- */
let pending = null;
function inProgress() { return G && G.started && !G.over; }
function askAbandon(kind, target) {
  pending = {kind, target};
  const t = fmt(elapsed());
  if (kind === 'diff') {
    $('mTitle').textContent = '这盘还没结束';
    $('mBody').innerHTML = `已经扫了 <b>${t}s</b>。<br>切到「${DIFF[target].label}」会放弃这一盘，计时已暂停。`;
    $('mYes').textContent = '放弃并切换';
  } else {
    $('mTitle').textContent = '这盘还没结束';
    $('mBody').innerHTML = `已经扫了 <b>${t}s</b>。<br>重开会放弃这一盘，计时已暂停。`;
    $('mYes').textContent = '放弃并重开';
  }
  pauseOn('modal');
  $('modal').classList.remove('hidden');
}
function closeModal() {
  $('modal').classList.add('hidden');
  pending = null;
  pauseOff('modal');
}
$('mNo').addEventListener('click', closeModal);
$('mYes').addEventListener('click', () => {
  const p = pending;
  $('modal').classList.add('hidden');
  pending = null;
  pauses.delete('modal');            // 直接丢弃，不结算这段暂停
  if (p && p.kind === 'diff') applyDiff(p.target);
  else newGame();
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

function applyDiff(d) {
  curDiff = d;
  localStorage.setItem('msg.diff', d);
  document.querySelectorAll('.diffs button')
    .forEach(x => x.classList.toggle('on', x.dataset.d === d));
  newGame();
  const on = document.querySelector('.diffs button.on');
  if (on && on.scrollIntoView) on.scrollIntoView({block: 'nearest', inline: 'center'});
}
function requestRestart() {
  if (inProgress()) askAbandon('restart');
  else newGame();
}
document.querySelectorAll('.diffs button').forEach(b => {
  b.addEventListener('click', () => {
    const d = b.dataset.d;
    if (d === curDiff && !inProgress()) { newGame(); return; }
    if (inProgress()) askAbandon('diff', d);
    else applyDiff(d);
  });
});
$('mode').addEventListener('click', () => {
  flagMode = !flagMode;
  $('mode').classList.toggle('on', flagMode);
  $('mode').textContent = flagMode ? '🚩 标旗' : '⛏ 挖开';
});
$('again').addEventListener('click', requestRestart);
charBox.addEventListener('click', () => { if (!inProgress()) newGame(); });
/* ---------- 退到后台自动暂停 ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseOn('hidden');
  else pauseOff('hidden');
});
window.addEventListener('blur', () => pauseOn('hidden'));
window.addEventListener('focus', () => { if (!document.hidden) pauseOff('hidden'); });
$('zoom').addEventListener('input', e => {
  cellSize = +e.target.value;
  localStorage.setItem('msg.cs', cellSize);
  $('zval').textContent = cellSize;
  board.style.setProperty('--cs', cellSize + 'px');
  board.style.gridTemplateColumns = `repeat(${G.w}, ${cellSize}px)`;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) { closeModal(); return; }
  if (e.key === 'r' || e.key === 'R') requestRestart();
  if (e.key === ' ') { e.preventDefault(); $('mode').click(); }
});
document.querySelectorAll('.diffs button')
  .forEach(b => b.classList.toggle('on', b.dataset.d === curDiff));
newGame();
{
  const on = document.querySelector('.diffs button.on');
  if (on && on.scrollIntoView) on.scrollIntoView({block: 'nearest', inline: 'center'});
}
</script>
